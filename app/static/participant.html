<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SketchFade</title>
<!--
  Participant view (tablet). Same server, API and logs as the researcher app (/).
  The researcher sets up the session once (participant, group, package, task);
  the participant then only sees a large canvas, one instruction per step and one
  main button. Levels, groups, packages and logs stay in the researcher app.
-->
<style>
  :root { --ink: #22304f; --accent: #3b4d8f; --warm: #a83a1e; --bg: #efebe2;
          --paper: #fbf8f1; --line: #d8cfbd; --muted: #7d7464; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .35; cursor: default; }
  .hidden { display: none !important; }

  /* --- researcher setup --- */
  #setup { max-width: 460px; margin: 6vh auto; padding: 28px; background: var(--paper);
           border-radius: 18px; box-shadow: 0 8px 30px rgba(40,30,10,.12); }
  #setup h1 { margin: 0 0 4px; font-size: 26px; }
  #setup p { margin: 0 0 18px; color: var(--muted); }
  #setup label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  #setup input, #setup select { width: 100%; padding: 11px; font-size: 16px; border: 1px solid var(--line);
                                border-radius: 10px; background: #fff; }
  #setup .go { width: 100%; margin-top: 22px; padding: 15px; font-size: 18px; font-weight: 600;
               background: var(--accent); color: #fff; }
  #setupMsg { margin-top: 12px; color: var(--warm); min-height: 20px; }

  /* --- participant view --- */
  #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 18px; padding: 14px 22px 8px; }
  #steps { display: flex; gap: 8px; }
  .dot { width: 34px; height: 8px; border-radius: 4px; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.now { background: var(--warm); }
  #stepName { font-size: 15px; color: var(--muted); }
  #clock { margin-left: auto; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #clock.low { color: var(--warm); }
  #gear { margin-left: 8px; background: none; color: var(--muted); font-size: 22px; padding: 6px 10px; }

  main { display: flex; justify-content: center; align-items: flex-start; gap: 22px; padding: 4px 22px; min-height: 0; }
  #board { position: relative; width: var(--size, 520px); height: var(--size, 520px); background: #fffdf8;
           border-radius: 16px; box-shadow: 0 8px 28px rgba(40,30,10,.14); touch-action: none; flex: none; }
  #board img, #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px; }
  #side { width: 300px; display: flex; flex-direction: column; gap: 16px; }
  #task { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0; }
  #hint { font-size: 17px; line-height: 1.45; margin: 0; color: #3d4560; }
  #refCard { background: var(--paper); border-radius: 14px; padding: 10px; }
  #refCard img { width: 100%; aspect-ratio: 1; display: block; }
  #refCard div { font-size: 13px; color: var(--muted); margin-top: 4px; }
  /* probe: guides of the other steps, off at the start, one button each */
  #guideBox { display: flex; flex-direction: column; gap: 8px; }
  #guideBox .gl { font-size: 14px; color: var(--muted); }
  #guideBtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .gbtn { padding: 10px 14px; font-size: 15px; background: var(--paper); color: var(--ink);
          box-shadow: 0 2px 6px rgba(40,30,10,.1); }
  .gbtn.on { background: #e6ecf7; box-shadow: inset 0 0 0 2px var(--accent); }
  #note { min-height: 48px; font-size: 16px; padding: 12px 14px; border-radius: 12px; background: #e6ecf7;
          color: var(--ink); }
  #note:empty { visibility: hidden; }

  footer { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px;
           padding: 12px 22px 20px; }
  .tool { padding: 14px 20px; font-size: 17px; background: var(--paper); color: var(--ink);
          box-shadow: 0 2px 6px rgba(40,30,10,.1); }
  .tool.on { background: #e6ecf7; box-shadow: inset 0 0 0 2px var(--accent); }
  #pens { display: flex; gap: 6px; background: var(--paper); padding: 6px; border-radius: 14px; }
  .pen { width: 46px; height: 46px; background: none; display: grid; place-items: center; }
  .pen.on { background: #e6ecf7; }
  .pen i { display: block; background: var(--ink); border-radius: 50%; }
  #main { padding: 16px 30px; font-size: 19px; font-weight: 700; background: var(--accent); color: #fff;
          box-shadow: 0 4px 12px rgba(59,77,143,.35); min-width: 250px; }
  #main.warm { background: var(--warm); box-shadow: 0 4px 12px rgba(168,58,30,.3); }

  /* full-screen messages between steps */
  #cover { position: fixed; inset: 0; background: rgba(239,235,226,.96); display: grid; place-items: center; }
  #coverCard { max-width: 520px; text-align: center; padding: 30px; }
  #coverTitle { font-size: 30px; font-weight: 700; margin: 0 0 12px; }
  #coverText { font-size: 18px; line-height: 1.5; margin: 0 0 26px; color: #3d4560; }
  #coverBtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #coverBtns button { padding: 15px 28px; font-size: 18px; font-weight: 600; background: var(--accent); color: #fff; }
  #coverBtns button.alt { background: var(--paper); color: var(--ink); }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(239,235,226,.6);
          font-size: 20px; }
</style>
</head>
<body>

<!-- researcher setup: filled once, before handing over the tablet -->
<div id="setup">
  <h1>SketchFade</h1>
  <p>Researcher setup. Hand the tablet to the participant after Start.</p>
  <label for="pid">Participant ID</label>
  <input id="pid" placeholder="e.g. P01" autocomplete="off">
  <label for="group">Group</label>
  <select id="group"><option>adaptive</option><option>fixed</option></select>
  <label for="pkg">Trained portrait (the Transfer test runs in the researcher app)</label>
  <select id="pkg"></select>
  <label for="taskSel">Task (in the I3 order)</label>
  <select id="taskSel">
    <option value="warmup" selected>Warm-up (stylus practice, nothing saved)</option>
    <option value="baseline">Baseline</option>
    <option value="practice">Practice (run twice: block 1, block 2)</option>
    <option value="post">Post-test</option>
    <option value="retention">Retention</option>
  </select>
  <label for="testMin">Test time limit (minutes, 0 = no limit)</label>
  <input id="testMin" type="number" min="0" step="0.5" value="10">
  <label for="probeSec">Probe time limit (seconds, 0 = no limit)</label>
  <input id="probeSec" type="number" min="0" step="5" value="15">
  <button class="go" id="go">Start</button>
  <div id="setupMsg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div id="steps"></div>
    <div id="stepName"></div>
    <div id="clock"></div>
    <button id="gear" title="Researcher setup">&#9881;</button>
  </header>
  <main>
    <div id="board">
      <img id="ghost" alt="">
      <canvas id="ink"></canvas>
    </div>
    <div id="side">
      <h2 id="task"></h2>
      <p id="hint"></p>
      <div id="refCard"><img id="ref" alt=""><div>Reference</div></div>
      <div id="guideBox" class="hidden">
        <div class="gl">Show the guide of another step:</div>
        <div id="guideBtns"></div>
      </div>
      <div id="note"></div>
    </div>
  </main>
  <footer>
    <button class="tool" id="undo">&#8630; Undo</button>
    <button class="tool" id="clear">Clear</button>
    <div id="pens" title="Pen size"></div>
    <button class="tool" id="eraser">Eraser</button>
    <button class="tool" id="check">Show me</button>
    <button id="main"></button>
  </footer>
</div>

<div id="cover" class="hidden">
  <div id="coverCard">
    <p id="coverTitle"></p>
    <p id="coverText"></p>
    <div id="coverBtns"></div>
  </div>
</div>
<div id="wait" class="hidden">One moment&hellip;</div>

<script>
const $ = id => document.getElementById(id);
const UI = 480;                      // drawing space of the API and the logs
const CHECK_MS = 2000;
const PREV_INK = "rgba(34, 48, 79, 0.33)";
const PENS = [1, 2, 3, 5, 8, 12];   // pen widths in drawing space (probes are scored at a fixed width)
const ERASE_R = 9;                  // eraser radius in drawing space

// What each construction step asks for, in plain words (keyed by layer name).
const STEP = {
  "block-in": ["Big shapes", "Sketch the big, simple shapes: the head, the eyes, the nose, the mouth and the neck."],
  "skeleton": ["Guide lines", "Add the guide lines: the centre line, and the lines for the eyes, nose, mouth and shoulders."],
  "contours": ["Outlines", "Draw the outlines of the face, the hair and the features. Follow the shapes you placed."],
  "shading":  ["Soft shading", "Add soft shading where the face turns away from the light."],
  "shadow":   ["Dark areas", "Fill in the darkest areas, like the hair and the deepest shadows."],
};
const TESTS = { baseline: "Baseline drawing", post: "Drawing check", retention: "Drawing check" };
// Steps that end with an unassisted redraw (probe). One pass gives every part 3 probes,
// so two practice blocks give 6: the minimum to fade from L3 to L0 (I3, Study Instruments v0.4).
// The tone steps (shading, shadow) are practised without a probe.
const PROBE_LAYERS = ["block-in", "skeleton", "contours"];

let st = null;               // last server state
let phase = "practice";      // practice | probe | test | warmup (no server calls)
let strokes = [], practice = [], byLayer = {}, cur = null;
let pen = 3, penSeen = false;
let tool = "pen", rub = null;  // rub: the eraser gesture in progress {at, removed}

async function post(url, body = {}) {
  try {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { return { error: "The drawing server is not reachable." }; }
}
const png = b => b ? "data:image/png;base64," + b : "";
function busy(on) { $("wait").classList.toggle("hidden", !on); }

// --- timers (formal tests and probes; limits set on the setup screen) ---------
// One timer at a time. It is stopped on every screen change, so a timer from an
// earlier task can never fire on the next one. When time is up, the running
// stroke is dropped and the drawing is submitted as if the participant pressed
// the main button; the server logs timeout: true.
let timer = null, timedOut = false, sending = false;
const limit = id => Math.max(0, +$(id).value || 0);  // setup value, 0 = no limit
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function stopTimer() {
  if (timer) clearInterval(timer);
  timer = null; timedOut = false;
  $("clock").textContent = ""; $("clock").className = "";
}
function startTimer(sec, warnAt, warnNote, onEnd) {
  stopTimer(); timedOut = false;
  if (!(sec > 0)) return;
  const end = Date.now() + sec * 1000;
  let warned = false;
  const tick = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    $("clock").textContent = "Time left " + mmss(left);
    if (!warned && left <= warnAt) {
      warned = true; $("clock").className = "low";
      if (warnNote) note(warnNote);
    }
    if (left > 0) return;
    clearInterval(timer); timer = null; timedOut = true;
    $("clock").textContent = "Time is up";
    cur = null;                    // a stroke still being drawn is not kept
    if (rub) {                     // an eraser gesture still running ends here (and is logged)
      const g = rub; rub = null;
      if (g.removed.length) erase("eraser", g.removed.map(pts => ({ pts })));
    }
    redraw(); updateButtons();
    onEnd();
  };
  timer = setInterval(tick, 250);
  tick();
}
const startTestTimer = () => {
  const sec = Math.round(limit("testMin") * 60);
  startTimer(sec, sec >= 120 ? 60 : 0, sec >= 120 ? "1 minute left." : "", () => finishTest());
};
const startProbeTimer = () => startTimer(Math.round(limit("probeSec")), 5, "", () => submitProbe());

// --- canvas -------------------------------------------------------------------
const ink = $("ink"), ctx = ink.getContext("2d");
function layout() {  // square board as large as the screen allows
  const side = window.innerWidth > 900 ? 344 : 0;
  const size = Math.max(320, Math.min(window.innerHeight - 190, window.innerWidth - side - 60, 760));
  document.documentElement.style.setProperty("--size", size + "px");
  ink.width = ink.height = Math.round(size * devicePixelRatio);
  redraw();
}
window.addEventListener("resize", layout);

function redraw() {
  const k = ink.width / UI;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, UI, UI);
  ctx.lineCap = ctx.lineJoin = "round";
  const draw = (list, color) => {
    ctx.strokeStyle = color;
    for (const s of list) {
      ctx.lineWidth = s.w;
      ctx.beginPath();
      s.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.stroke();
    }
  };
  // earlier steps stay under the current one, also during a probe (the drawer's own construction)
  if ((phase === "practice" || phase === "probe") && st)
    for (const [i, list] of Object.entries(byLayer)) if (+i !== st.layer) draw(list, PREV_INK);
  draw(strokes.concat(cur ? [cur] : []), "#22304f");
  if (rub) {  // eraser outline under the pen while rubbing
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(168, 58, 30, 0.6)";
    ctx.beginPath(); ctx.arc(rub.at[0], rub.at[1], ERASE_R, 0, 2 * Math.PI); ctx.stroke();
  }
}

const pos = e => {
  const b = ink.getBoundingClientRect();
  return [(e.clientX - b.left) * UI / b.width, (e.clientY - b.top) * UI / b.height];
};
ink.onpointerdown = e => {
  if (e.pointerType === "pen") penSeen = true;
  if (penSeen && e.pointerType === "touch") return;   // palm rejection once a stylus is used
  ink.setPointerCapture(e.pointerId);
  if (tool === "eraser" || (e.buttons & 32)) {        // eraser tool, or the stylus's eraser end
    const p = pos(e);
    rub = { at: p, removed: [] }; rubOut(p, p);
    return;
  }
  cur = { pts: [pos(e)], w: pen };
};
ink.onpointermove = e => {
  if (rub) { const p = pos(e), a = rub.at; rub.at = p; rubOut(a, p); return; }
  if (cur) { cur.pts.push(pos(e)); redraw(); }
};
ink.onpointerup = ink.onpointercancel = async () => {
  if (rub) {                                          // end of an eraser gesture: log what went
    const r = rub; rub = null; redraw();
    if (r.removed.length) erase("eraser", r.removed.map(pts => ({ pts })));
    return;
  }
  if (!cur) return;
  const s = cur; cur = null;
  if (s.pts.length < 2) return redraw();
  strokes.push(s); redraw(); updateButtons();
  if (phase === "warmup") return;                   // warm-up strokes are not sent or logged
  const r = await post("/api/stroke", { pts: s.pts, w: s.w });
  if (r.error) return note(r.error);
  s.pts = r.pts; st = r; redraw(); paintGuides();   // L3: the stroke may be gently corrected
};

// Eraser: rub out the parts of the current step's strokes within ERASE_R of the path a -> b.
// A stroke cut in the middle becomes two strokes in its place (so Undo still removes the
// last stroke drawn); pieces shorter than 2 points are dropped. Only the canvas changes;
// what was rubbed out is logged at the end of the gesture.
function distSeg(p, a, b) {  // distance from point p to segment a-b
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function rubOut(a, b) {
  const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / (ERASE_R / 2)));
  const spots = Array.from({ length: n + 1 }, (_, i) =>
    [a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]);
  const near = q => spots.some(s => Math.hypot(q[0] - s[0], q[1] - s[1]) <= ERASE_R);
  const nearSeg = (q, r) => spots.some(s => distSeg(s, q, r) <= ERASE_R);
  let changed = false;
  const out = [];
  for (const s of strokes) {
    const runs = [], gone = [];
    let run = [], hit = false;
    for (const q of s.pts) {
      if (near(q)) { hit = true; gone.push(q); if (run.length) runs.push(run); run = []; continue; }
      if (run.length && nearSeg(run[run.length - 1], q)) { hit = true; runs.push(run); run = []; }
      run.push(q);  // a segment passing under the eraser is cut even if its ends are outside
    }
    if (run.length) runs.push(run);
    if (!hit) { out.push(s); continue; }
    changed = true;
    for (const r of runs) {
      if (r.length >= 2) out.push({ pts: r, w: s.w });
      else gone.push(...r);
    }
    if (gone.length) rub.removed.push(gone);
  }
  if (changed) { strokes = out; updateButtons(); }
  redraw();
}

// --- screen -------------------------------------------------------------------
function note(t) { $("note").textContent = t || ""; }
function paintGuides() {
  $("ghost").src = png(st.ghost);
  $("ref").src = png(st.ref);
}
function render() {
  setTool("pen");  // every new screen starts with the pen, so the eraser is never left on by surprise
  if (phase === "warmup") return renderWarmup();
  const names = st.layers, i = st.probe !== null ? st.probe : st.layer;
  const [title, hint] = STEP[names[i]] || [names[i], ""];
  $("steps").innerHTML = phase === "test" ? "" : names.map((_, k) =>
    `<div class="dot ${k < i ? "done" : k === i ? "now" : ""}"></div>`).join("");
  $("stepName").textContent = phase === "test" ? "" : `Step ${i + 1} of ${names.length} · ${title}`;
  if (phase === "practice") {
    $("task").textContent = title;
    $("hint").textContent = hint + " The faint guide shows where. Press Done when the step looks right to you.";
    $("main").textContent = "Done with this step →";
    $("main").className = "";
  } else if (phase === "probe") {
    $("task").textContent = "Now on your own";
    $("hint").textContent = `Draw the same step again, without its guide on top. Your earlier steps stay faint `
      + `to help you place it. Use the reference picture: ${hint.charAt(0).toLowerCase() + hint.slice(1)}`;
    $("main").textContent = "Done";
    $("main").className = "warm";
  } else {
    $("task").textContent = TESTS[st.task] || "Drawing";
    $("hint").textContent = "Draw the portrait on your own, as well as you can. There is no help in this part.";
    $("main").textContent = "I'm finished";
    $("main").className = "warm";
  }
  $("refCard").classList.toggle("hidden", phase === "practice");  // guide is on the canvas in practice
  renderGuideBtns();
  paintGuides();
  updateButtons();
  redraw();
}
function renderWarmup() {  // stylus practice: blank canvas, no guide, no steps
  $("steps").innerHTML = "";
  $("stepName").textContent = "Warm-up";
  $("task").textContent = "Try the pen";
  $("hint").textContent = "Draw lines, circles, anything you like, to get used to the pen and the tablet. "
    + "Try the pen sizes, the eraser, Undo and Clear. Nothing here is saved.";
  $("main").textContent = "I'm done practising";
  $("main").className = "";
  $("refCard").classList.add("hidden");
  $("guideBox").classList.add("hidden");
  $("ghost").removeAttribute("src");
  updateButtons();
  redraw();
}
// Probe: the guide of any other step can be shown (off at the start, never the probed
// step; the server keeps it apart from practice and logs it with the probe).
function renderGuideBtns() {
  const on = phase === "probe";
  $("guideBox").classList.toggle("hidden", !on);
  if (!on) return;
  $("guideBtns").innerHTML = st.layers.map((name, k) => k === st.probe ? "" :
    `<button class="gbtn${st.visible.includes(k) ? " on" : ""}" data-g="${k}">${(STEP[name] || [name])[0]}</button>`).join("");
}
$("guideBtns").onclick = async e => {
  const b = e.target.closest("[data-g]");
  if (!b || phase !== "probe") return;
  const k = +b.dataset.g;
  const want = st.visible.includes(k) ? st.visible.filter(x => x !== k) : st.visible.concat(k);
  const r = await post("/api/visible", { visible: want });
  if (r.error) return note(r.error);
  st = r; renderGuideBtns(); paintGuides();
};
// own earlier steps drawn faint right now (logged with the probe)
const ownShown = () => Object.entries(byLayer)
  .filter(([i, list]) => +i !== st.layer && list.length).map(([i]) => st.layers[+i]);

function updateButtons() {
  const anyL1 = st && st.helped && st.levels.some(p => p.level === 1);
  $("check").classList.toggle("hidden", !(phase === "practice" && anyL1));
  $("undo").disabled = !strokes.length;
  $("clear").disabled = !strokes.length;
  // every step needs at least one stroke before Done (practice, probe and tests);
  // after a timeout the button stays usable, so a failed automatic submit can be retried
  $("main").disabled = phase !== "warmup" && !strokes.length && !timedOut;
}
$("pens").innerHTML = PENS.map(w =>
  `<button class="pen${w === pen ? " on" : ""}" data-w="${w}"><i style="width:${w * 3}px;height:${w * 3}px"></i></button>`).join("");
function setTool(t) {  // "pen" (with the chosen size) or "eraser"
  tool = t;
  $("eraser").classList.toggle("on", t === "eraser");
  document.querySelectorAll(".pen").forEach(x =>
    x.classList.toggle("on", t === "pen" && +x.dataset.w === pen));
}
$("pens").onclick = e => {
  const b = e.target.closest("[data-w]"); if (!b) return;
  pen = +b.dataset.w; setTool("pen");
};
$("eraser").onclick = () => setTool(tool === "eraser" ? "pen" : "eraser");

function cover(title, text, buttons) {
  $("coverTitle").textContent = title;
  $("coverText").textContent = text;
  $("coverBtns").innerHTML = "";
  for (const [label, fn, alt] of buttons) {
    const b = document.createElement("button");
    b.textContent = label; if (alt) b.className = "alt";
    b.onclick = () => { $("cover").classList.add("hidden"); fn && fn(); };
    $("coverBtns").appendChild(b);
  }
  $("cover").classList.remove("hidden");
}

// --- actions ------------------------------------------------------------------
// Undo / Clear remove strokes from the canvas; the server logs what was removed
// (the strokes themselves stay in the log as they were drawn). Warm-up logs nothing.
function erase(kind, removed) {
  redraw(); updateButtons();
  if (phase !== "warmup" && removed.length) post("/api/erase", { kind, strokes: removed });
}
$("undo").onclick = () => { const s = strokes.pop(); erase("undo", s ? [s] : []); };
$("clear").onclick = () => { const s = strokes; strokes = []; erase("clear", s); };
$("check").onclick = async () => {
  const r = await post("/api/check"); if (r.error) return;
  $("ghost").src = png(r.ghost);
  setTimeout(() => { $("ghost").src = png(st.ghost); }, CHECK_MS);
};

$("main").onclick = async () => {
  if (phase === "practice") {             // end of a step: unassisted redraw, line steps only
    if (!PROBE_LAYERS.includes(st.layers[st.layer])) return nextStep();
    cover("Now on your own",
          "The guide of this step will be hidden. Draw this step again on your own, looking at the reference "
          + "picture. Your earlier steps stay faint, and you can show the guide of another step if it helps.",
          [["OK, start", startProbe]]);
  } else if (phase === "probe") {
    await submitProbe();
  } else if (phase === "warmup") {
    cover("Warm-up done", "Please hand the tablet back to the researcher.",
          [["OK", toSetup]]);
  } else {
    await finishTest();
  }
};

async function startProbe() {
  practice = strokes; strokes = [];
  const r = await post("/api/probe/start");
  if (r.error) { strokes = practice; return note(r.error); }
  st = r; phase = "probe"; note(""); render();
  startProbeTimer();
}

async function submitProbe() {
  if (sending) return;           // the timer and the Done button cannot both submit
  sending = true; busy(true);
  const r = await post("/api/probe/submit", { strokes, timeout: timedOut, own_shown: ownShown() });
  busy(false); sending = false;
  if (r.error) return note(r.error);  // the timer keeps running; Done tries again
  stopTimer();
  st = r; phase = "practice";
  strokes = practice; practice = [];
  // Help level changes (r.changes) are logged by the server but never announced:
  // telling the participant would reveal the condition (I3, I8).
  await nextStep();
}

// Keep this step's drawing and move on; after the last step, the participant chooses
// to practise again or to stop and hand the tablet back (nothing ends on its own).
async function nextStep() {
  const next = st.layer + 1;
  byLayer[st.layer] = strokes;
  // the step's drawing is saved as an image (exports/practice/<participant>/pass<N>/);
  // if the server can't be reached, stay here and offer Try again (nothing is lost)
  busy(true);
  const saved = await post("/api/practice/step", { strokes });
  busy(false);
  if (saved.error) {
    render();
    return cover("Connection problem", saved.error + " Your drawing is kept.", [["Try again", nextStep]]);
  }
  if (next < st.layers.length) return goToLayer(next, "Saved. On to the next step.");
  render();
  cover("All steps done",
        "You finished every step of this portrait. You can practise it again from the start, "
        + "or tell the researcher you are done and hand the tablet back.",
        [["Practise again", restartPractice],
         ["I'm done", () => note("Please tell the researcher you are done and hand the tablet back."), true]]);
}

// Move to a step. If the server can't be reached, stay on the current step
// (drawing kept) and offer Try again, which repeats only this move, not the probe.
async function goToLayer(next, msg, restart = false) {
  busy(true);
  const r = await post("/api/layer", { layer: next });
  busy(false);
  if (r.error) {
    render();
    return cover("Connection problem", r.error + " Your drawing is kept.",
                 [["Try again", () => goToLayer(next, msg, restart)]]);
  }
  if (restart) { byLayer = {}; practice = []; }
  st = r; strokes = byLayer[next] || [];
  render(); note(msg);
}

function restartPractice() { return goToLayer(0, "", true); }

async function finishTest() {
  if (sending) return;           // the timer and "I'm finished" cannot both export
  sending = true; busy(true);
  const r = await post("/api/export", { strokes, timeout: timedOut });
  busy(false); sending = false;
  if (r.error) return note(r.error);  // drawing kept; "I'm finished" tries again
  stopTimer();
  strokes = []; redraw();
  cover("Thank you", "Your drawing is saved. Please hand the tablet back to the researcher.",
        [["OK", toSetup]]);
}

// --- researcher setup ---------------------------------------------------------
let hasPackage = false;
async function loadPackages() {
  const r = await post("/api/packages");
  const ok = (r.packages || []).filter(m => m.review.status === "approved").reverse();
  const opts = ok.length
    ? ok.map(m => `<option value="${m.id}">${m.prompt || m.id} (${m.id})</option>`).join("")
    : `<option value="">No approved portrait yet: prepare one in the researcher app</option>`;
  // rebuilding the list resets it to the first option, which would silently switch the
  // portrait between tasks: keep the facilitator's earlier choice when it still exists
  const keep = $("pkg").value;
  $("pkg").innerHTML = opts;
  if (ok.some(m => m.id === keep)) $("pkg").value = keep;
  hasPackage = ok.length > 0;
  updateGo();
}
function updateGo() {  // the warm-up needs no package
  $("go").disabled = !hasPackage && $("taskSel").value !== "warmup";
}
$("taskSel").onchange = updateGo;

function showApp() {
  stopTimer();
  $("setup").classList.add("hidden"); $("app").classList.remove("hidden");
  layout(); render(); note("");
}
function toSetup() {
  stopTimer();
  $("app").classList.add("hidden"); $("setup").classList.remove("hidden"); loadPackages();
}

$("go").onclick = async () => {
  $("setupMsg").textContent = "";
  byLayer = {}; strokes = []; practice = [];
  const task = $("taskSel").value;
  if (task === "warmup") {  // stylus practice: no session, nothing logged
    st = null; phase = "warmup"; showApp();
    return;
  }
  const picked = $("group").value;
  let r = await post("/api/start", { participant: $("pid").value, group: picked,
                                    package: $("pkg").value });
  if (r.error) return void ($("setupMsg").textContent = r.error);
  const resumed = r.resumed;  // only /api/start says whether the participant existed
  if (task !== "practice") {
    r = await post("/api/task", { task });
    if (r.error) return void ($("setupMsg").textContent = r.error);
  }
  st = r;
  phase = st.task === "practice" ? "practice" : "test";
  $("group").value = st.group;  // a returning participant keeps their first group
  showApp();
  const intro = () => {
    if (phase === "practice")
      // same words for both groups: never mention fading or the conditions (I3)
      cover("Let's draw a portrait", "You will build the face step by step, from big shapes to details. "
            + "A faint guide shows where to draw. After some steps you redraw the step once on your own.",
            [["Start", null]]);
    else {  // formal test: the clock starts when the participant presses Start
      const min = limit("testMin");
      cover(TESTS[st.task] || "Drawing", "Draw the portrait on your own, as well as you can. There is no help "
            + "in this part. " + (min > 0 ? `You have ${min} minutes; the time left is shown at the top.`
                                          : "Take your time."),
            [["Start", startTestTimer]]);
    }
  };
  if (!resumed) return intro();
  // the group is named only when the pick differs, so the facilitator can catch it;
  // otherwise this screen (seen on the tablet) shows no condition
  const kept = picked !== st.group
    ? `Group kept: ${st.group} (you picked ${picked}; the first assignment never changes). `
    : "";
  cover("Returning participant", `${st.participant} has a session from before. ${kept}`
        + "Their settings carry over. Press Continue, then hand the tablet over.",
        [["Continue", intro], ["Back to setup", toSetup, true]]);
};
$("gear").onclick = () => {
  if (!confirm("Return to the researcher setup? The current drawing on screen will be cleared.")) return;
  toSetup();
};

loadPackages();
</script>
</body>
</html>
